[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dvault-control-plane"
version = "0.1.0"
description = "Local synthetic-data control plane for DVault"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2.0",
  "fastapi>=0.115,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "openpyxl>=3.1,<4.0",
  "python-multipart>=0.0.20,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1.0", "pytest>=8.0,<9.0"]

[project.scripts]
dvault-seed = "app.seed:main"
dvault-ingest-fixtures = "scripts.ingest_fixtures:main"
dvault-export-openapi = "scripts.export_openapi:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
packages = ["app", "scripts"]

[tool.setuptools.package-data]
app = ["fixtures/*.json", "fixtures/documents/*"]
